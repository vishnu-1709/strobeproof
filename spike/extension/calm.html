<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calm measurement (spike)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  .patch { position: absolute; top: 20%; height: 60%; width: 20%; }
  /* Patch 1: control, no filter. Expect 255. */
  #p1 { left: 5%; background: #ffffff; }
  /* Patch 2: white through the Calm filter. */
  #p2 { left: 30%; background: #ffffff; filter: grayscale(1) brightness(0.32); }
  /* Patch 3: mid-grey through the Calm filter. Separates sRGB from linear-light. */
  #p3 { left: 55%; background: #808080; filter: grayscale(1) brightness(0.32); }
  /* Patch 4: saturated red through the Calm filter. Grayscale should remove it. */
  #p4 { left: 80%; background: #ff0000; filter: grayscale(1) brightness(0.32); }
</style>
</head>
<body>
  <div class="patch" id="p1"></div>
  <div class="patch" id="p2"></div>
  <div class="patch" id="p3"></div>
  <div class="patch" id="p4"></div>
</body>
</html>
